name: Update Rumble episode archive

on:
  schedule:
    # ~10pm Central time, daily -- close enough behind the show (which airs
    # weekly but on a schedule that occasionally shifts) that nothing is
    # ever more than a day stale. GitHub Actions cron is UTC-only and
    # doesn't follow DST, so both offsets are listed; running twice near
    # the March/November changeover is harmless since the script is a
    # no-op when there's nothing new.
    - cron: '0 3 * * *'  # 10pm CDT (roughly Mar-Nov)
    - cron: '0 4 * * *'  # 10pm CST (roughly Nov-Mar)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Rumble for new episodes
        run: node scripts/snapshot-rumble-episodes.mjs

      - name: Commit and push if the archive changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/episodes-rumble-archive.json
          if git diff --cached --quiet; then
            echo "No new episodes."
          else
            git commit -m "Update Rumble episode archive [automated]"
            git push
          fi
